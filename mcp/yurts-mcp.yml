note: >-
  Legion Intelligence (formerly Yurts) states in its own llms.txt that the platform "supports the
  Model Context Protocol (MCP)". No publicly reachable MCP server was found, and no candidate tool
  list could be derived either, because the provider publishes no OpenAPI to derive one from. This
  file records the claim and the probes that failed to confirm it. No `type: MCPServer` pointer is
  wired into apis.yml: that pointer asserts a reachable agent surface, and asserting one here would
  credit the provider with an endpoint an agent cannot call.
