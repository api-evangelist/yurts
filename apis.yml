x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    Legion Intelligence (formerly Yurts) states in its own llms.txt that the platform supports MCP
    and "offers REST API extensibility", but there is no public developer portal: its sitemap has no
    /pricing, /docs or /developers entry, docs.legionintel.com is a dead Cloudflare origin whose
    plain-HTTP root 302s to an internal https://drive.google.com/a/legionintel.com, api.legionintel.com
    returns a zero-byte 404 for every path including the control probe, and platform.legionintel.com
    redirects every unknown path to /auth/signin — the interface is delivered inside a customer's
    accredited deployment, not published.
  evidence:
